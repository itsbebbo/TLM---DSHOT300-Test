; ESC Tester - M5Stack Core2
; Built with pioarduino (Arduino-ESP32 3.x on ESP-IDF 5.x).
; The upstream `platform = espressif32` is NOT usable here: it lags on Arduino 2.x,
; whose legacy RMT API cannot express the DShot300 symbols cleanly.

[platformio]
; Keep build output and downloaded libraries off Google Drive: the whole .pio
; workspace (build/ and libdeps/) lives on the local disk instead. PlatformIO
; expands `~` itself (to USERPROFILE on Windows, HOME on macOS/Linux), unlike
; ${sysenv.USERPROFILE}, which is empty on macOS and resolved to /PlatformIO.
workspace_dir = ~/PlatformIO/workspaces/esc-tester

; 55.03.311 = Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5. The newer 55.03.312 needs
; PlatformIO Core >= 6.2.0; move to it after `pio upgrade`.
[env:m5stack-core2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-core2
framework = arduino

; The Core2 talks to the host through a CP2104 bridge, not native USB, so there
; is no ARDUINO_USB_* configuration here and the port disappears on reset.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    m5stack/M5Unified
    lvgl/lvgl@^9.6.0

; LVGL is configured entirely through build flags (LV_CONF_SKIP), so there is no
; lv_conf.h to keep in sync with the library version.
build_flags =
    ; Arduino-ESP32 defaults CORE_DEBUG_LEVEL to 0, which compiles every
    ; ESP_LOGE/W/I in the firmware out entirely - including the ones that report
    ; RMT init failures and the telemetry parser falling back to its sliding
    ; window. 3 = INFO puts them on the serial monitor, where they were always
    ; meant to be.
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_SKIP=1
    -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_FONT_MONTSERRAT_48=1
    ; 32 kB, down from the 49152 the CoreS3 build used: LVGL's pool is a static
    ; array, and on the classic ESP32 it competes with the draw buffers and the
    ; task stacks for one DRAM segment. Four screens of labels, a bar and a
    ; four-column table do not come close to filling it.
    -DLV_MEM_SIZE=32768
    -DLV_DEF_REFR_PERIOD=33
    -DLV_USE_LOG=0
